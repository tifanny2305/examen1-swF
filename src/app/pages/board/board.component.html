<!-- Header section -->
<header class="bg-white shadow-md p-4 flex justify-between items-center">
  <div class="flex items-center space-x-4">
    <div class="bg-gray-200 rounded px-3 py-1">
      <span class="text-gray-600 text-base font-semibold">Código de Sala: </span>
      <span class="font-mono font-semibold">{{ roomCode }}</span>
    </div>
  </div>
  <div class="flex space-x-4">
    <button class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded shadow">
      Importar
    </button>
    <button class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded shadow">
      Exportar
    </button>

    <button (click)="showGeneratedHTML()" 
      class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded shadow">
      HTML
    </button>

  </div>
</header>


<!-- El contenido de las 3 columnas -->
<div class="flex h-[calc(100vh-64px)]"> <!-- Adjusting height to account for header -->

  <!-- Columna Izquierda -->
  <div class="w-1/4 bg-white border-r border-gray-200 overflow-y-auto">
    <div class="p-4 border-b border-gray-200">
      <h2 class="font-bold text-lg text-gray-700">Components</h2>
    </div>

    <app-colum-left [components]="components" [contextMenu]="contextMenu"></app-colum-left>

  </div>

  <!-- Columna del medio -->
  <div class="w-2/4 bg-gray-50 relative overflow-hidden" #canvas (contextmenu)="onCanvasContextMenu($event)"
    (mousemove)="onMouseMove($event)" (mouseup)="onMouseUp()">

    <ng-container *ngFor="let comp of components">
      <ng-container *ngTemplateOutlet="renderComponent; context: { comp: comp }"></ng-container>
    </ng-container>

    <!-- Menú contextual -->
    <div *ngIf="contextMenu.visible" [style.left.px]="contextMenu.x" [style.top.px]="contextMenu.y"
      class="fixed bg-white border rounded shadow z-[1000]">
      <button (click)="addChild(contextMenu.targetId)" class="block px-4 py-2 hover:bg-gray-100 w-full text-left">
        Agregar hijo
      </button>

      <!-- <button (click)="copyComponent(findComponentById(contextMenu.targetId, components)!)"
        class="block px-4 py-2 hover:bg-gray-100 w-full text-left">
        Copiar
      </button>
      <button (click)="cutComponent(findComponentById(contextMenu.targetId, components)!)"
        class="block px-4 py-2 hover:bg-gray-100 w-full text-left">
        Cortar
      </button>
      <button (click)="pasteComponent(contextMenu.targetId)"
        class="block px-4 py-2 hover:bg-gray-100 w-full text-left">
        Pegar dentro
      </button> -->

      <button (click)="removeComponent(contextMenu.targetId)"
        class="block px-4 py-2 hover:bg-gray-100 w-full text-left">
        Eliminar
      </button>
    </div>

    <!-- Template de renderizado recursivo -->
    <ng-template #renderComponent let-comp="comp">
      <div class="border p-2 text-center cursor-move" [ngStyle]="comp.style"
        [style.position]="comp.parentId ? 'absolute' : 'relative'" [style.min-width.px]="50" [style.min-height.px]="40"
        (mousedown)="onMouseDown($event, comp)" (click)="selectComponent(comp, $event)"
        (contextmenu)="onComponentContextMenu($event, comp.id)">
        <!-- Mostrar el contenido si existe -->
        {{ comp.content || comp.label }}

        <!-- Renderizar hijos si los hay -->
        <ng-container *ngIf="comp.children">
          <ng-container *ngFor="let child of comp.children">
            <ng-container *ngTemplateOutlet="renderComponent; context: { comp: child }"></ng-container>
          </ng-container>
        </ng-container>
      </div>
    </ng-template>

    
    
  </div>

  <!-- Columna Derecha -->
  <div class="w-1/4 bg-white border-l border-gray-200 overflow-y-auto">
    <app-colum-right [selectedComponent]="selectedComponent"></app-colum-right>
  </div>

  <!-- Modal para mostrar el HTML generado -->
  <div *ngIf="isHtmlModalOpen" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg p-6 max-w-2xl w-full">
      <h3 class="text-xl font-bold mb-4">HTML Generado</h3>
      <textarea 
        readonly 
        class="w-full h-64 p-2 border border-gray-300 rounded mb-4 font-mono text-sm">
        {{ generatedHTML }}
      </textarea>
      <button 
        (click)="isHtmlModalOpen = false" 
        class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded shadow">
        Cerrar
      </button>
    </div>
  </div>


</div>
